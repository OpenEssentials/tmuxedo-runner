[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/emu",
    "crates/holder",
    "crates/detect",
    "crates/schema",
    "crates/schema-wasm",
    "crates/runner",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
tmuxedo-protocol = { path = "crates/protocol" }
tmuxedo-emu = { path = "crates/emu" }
tmuxedo-holder = { path = "crates/holder" }
tmuxedo-detect = { path = "crates/detect" }
tmuxedo-schema = { path = "crates/schema" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vt100 = "0.16"
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "underline-color", "layout-cache"] }
portable-pty = "0.9"
libc = "0.2"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
clap = { version = "4", features = ["derive"] }
toml = "0.8"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
getrandom = "0.2"
tempfile = "3"
qrcode = { version = "0.14", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "unwind"

# Hashing a debug-built 100+ MB binary (self-update tests) is slow without this.
[profile.dev.package.sha2]
opt-level = 3

# The terminal emulator and the regex engine, optimised in test builds: the detect
# tests read every byte prefix of the recorded sessions (crates/detect/tests/emulated.rs).
# The detect crate itself stays unoptimised, so its coverage is exact.
[profile.dev.package.vt100]
opt-level = 2
[profile.dev.package.tmuxedo-emu]
opt-level = 2
[profile.dev.package.regex]
opt-level = 2
[profile.dev.package.regex-automata]
opt-level = 2
[profile.dev.package.regex-syntax]
opt-level = 2
[profile.dev.package.aho-corasick]
opt-level = 2
[profile.dev.package.memchr]
opt-level = 2
