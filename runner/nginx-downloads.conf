# tmuxedo downloads: static runner binaries, install.sh and manifest.json under /dl/.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    location = /healthz { access_log off; return 200 "ok\n"; }

    location /dl/ {
        autoindex off;
        default_type application/octet-stream;
        types { application/json json; text/x-shellscript sh; }
        # The manifest and installer change every release; binaries are named per release
        # only by content, so nothing here may be cached long.
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location / { return 404; }
}
