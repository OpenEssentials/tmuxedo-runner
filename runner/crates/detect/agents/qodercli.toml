# Qoder CLI. Format and meaning: docs/design/agent-detection.md.
agent = "qodercli"
title = "Qoder CLI"
revision = "2026-10-05.1"
launch = "qodercli"
names = ["qoderclicn", "qoder", "qodercn"]

[[signal]]
name = "question"
status = "blocked"
rank = 30
scope = "screen"
when = '''
"waiting for user confirmation" and ("yes" or "no" or "allow" or "reject")
or "awaiting approval" and ("allow" or "reject")
or "permission required" or "allow once or always?" or "asking user"
or "enter your response" or "review your answers:" or "shell awaiting input"'''

[[signal]]
name = "cancel"
status = "working"
rank = 20
scope = "screen"
when = '''"(esc to cancel,"'''

[[signal]]
name = "spinner"
status = "working"
rank = 10
scope = "screen"
when = '''line /^\s*[\x{2800}-\x{28FF}]\s+.*\p{Alphabetic}/'''
