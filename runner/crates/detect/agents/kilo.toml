# Kilo Code CLI (an opencode derivative). Format and meaning: docs/design/agent-detection.md.
agent = "kilo"
title = "Kilo Code"
revision = "2026-10-05.1"
launch = "kilo"
names = ["kilo-code", "kilo code"]

[[signal]]
name = "permission"
status = "blocked"
rank = 30
scope = "screen"
when = '''
"△ Permission required"
or "esc dismiss" and ("enter confirm" or "enter submit" or "enter toggle") and ("↑↓ select" or "⇆ tab")'''

[[signal]]
name = "interrupt"
status = "working"
rank = 10
scope = "screen"
when = '''"esc interrupt"'''
