# Antigravity CLI. Format and meaning: docs/design/agent-detection.md.
agent = "agy"
title = "Antigravity CLI"
revision = "2026-10-05.1"
launch = "agy"
names = ["antigravity", "antigravity-cli"]

[[signal]]
name = "approval"
status = "blocked"
rank = 30
scope = "screen"
when = '''"requesting permission for:" and ("do you want to proceed?" or "tab amend" and "edit command")'''

[[signal]]
name = "spinner"
status = "working"
rank = 20
scope = "screen"
when = '''line /^\s*[\x{2800}-\x{28FF}]+\s+\p{Alphabetic}+\w*ing\b/'''

[[signal]]
name = "background"
status = "working"
rank = 10
scope = "last 5"
when = '''line /(?i)·\s*[1-9][0-9]*\s+task/'''
