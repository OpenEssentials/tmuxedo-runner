# Gemini CLI. Format and meaning: docs/design/agent-detection.md.
agent = "gemini"
title = "Gemini CLI"
revision = "2026-10-05.1"
launch = "gemini"

[[signal]]
name = "approval"
status = "blocked"
rank = 30
scope = "screen"
when = '''
"│ Apply this change" or "│ Allow execution"
or "yes" and ("waiting for user confirmation" or "│ Do you want to proceed" or "do you want to proceed?")
or line /(?i)^\s*❯.*(?:yes|allow)/'''

[[signal]]
name = "turn"
status = "working"
rank = 10
scope = "screen"
when = '''"esc to cancel"'''
