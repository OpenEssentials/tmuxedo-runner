# CI on pull requests and on `main`: the runner on Linux (fmt, clippy, tests,
# the agent-detection coverage gate) and natively on macOS (Apple Silicon
# always, Intel off the pull-request path), tmuxedo for Mac (apps/mac:
# unsigned build, XCTest, launchd and isolation checks), the TypeScript
# protocol package and its fixtures, the publication gate (scripts/scrub.py)
# and two secret scanners over the whole history. GitHub-hosted runners only.
# The one secret, SCRUB_PRIVATE_PATTERNS, holds the operator's scrub gates
# (scripts/scrub.py explains why they are not in the repository); pull
# requests from forks run without it. Actions are pinned by commit SHA (the
# tag is in the comment).
#
# ── WHAT A macOS MINUTE COSTS, AND WHY THIS FILE IS SHAPED LIKE THIS ──
#
# A GitHub-hosted macOS minute is billed as TEN included minutes. The
# organisation's Actions budget is $0 permanently and `prevent_further_usage`
# is set, so exhausting the 50,000-minute allowance is not an invoice — it
# STOPS CI FOR EVERY REPOSITORY IN THE ORGANISATION until the month turns.
#
# Measured over the seven runs of 2026-10-16..22, one run of this workflow
# spent ~36 real macOS minutes across three 10x jobs: ~360 included-equivalent
# minutes, or 0.72% of the whole month, PER RUN. This repository was 23% of
# the organisation's entire monthly consumption. Three things were paying for
# nothing, and each has a line below that stops it:
#
#   1. `push: branches: ['**']` fired on every push to every branch, and a
#      branch with an open pull request fired TWICE (the push run and the
#      pull_request run are different concurrency groups, so neither cancels
#      the other). Pushes also never cancelled, so an agent pushing a branch
#      every few minutes queued full runs, macOS jobs and all. `push` is now
#      `main` only: a branch is covered by its pull request, once.
#   2. The macOS jobs ran in parallel with `runner-linux`, so a tree whose
#      shared `cargo clippy`/`cargo test` was already broken still bought
#      three macOS jobs. In four of those seven runs `runner-linux` failed and
#      ~1,640 included-equivalent minutes were spent re-discovering it at 10x.
#      The macOS jobs now `needs: runner-linux`. Consequence worth knowing:
#      while `main` is red on Linux, the macOS jobs do not run at all. That is
#      deliberate — fix Linux first, it costs a tenth as much to learn on.
#   3. Intel ran on every pull request. It was the single most expensive line
#      in the sample (95 of 250 real macOS minutes) for a platform GitHub is
#      retiring, testing the same source as Apple Silicon. It now runs on
#      `main` and on `workflow_dispatch`, not on pull requests. Releases are
#      unaffected: release.yml builds both architectures from a `v*` tag.
#
# `runner-macos` also had NO `timeout-minutes`, so a hung 10x job billed to
# the six-hour default: 3,600 included-equivalent minutes, 7% of the month,
# from one hang. It is bounded now.
#
# A fourth: the macOS jobs ran for changes that cannot reach them. A
# documentation-only pull request bought Apple Silicon and `mac-app`. The
# `changes` job below decides, and it is written as a DENY list — only paths
# that PROVABLY cannot affect a native build are ignorable, and anything it
# does not recognise spends the minutes. An allow list would have silently
# skipped macOS the first time someone added a directory, and a missing test
# run is a worse outcome than a wasted one. Note what is deliberately NOT
# ignorable: this file. A gate that skips validating its own change is a gate
# that can break the macOS lane and nobody finds out until a release.
name: ci
on:
  # `main` only. Every other branch is covered by its pull request — once,
  # not once per push and again for the pull request. See the header.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  RUST_VERSION: 1.96.1
  CARGO_TERM_COLOR: never
jobs:
  runner-linux:
    # hangar-big, NOT hangar: it builds the Rust workspace inside dind
    # (cargo fmt, clippy, tests through runner/Dockerfile.downloads).
    # The shared pool is 6Gi memory and a 4Gi work volume; this one gets
    # 16Gi and 80Gi. Nothing here is private either -- see above.
    runs-on: hangar-big
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The test stage of runner/Dockerfile.downloads (rust:1.96.1-bookworm):
      # cargo fmt --check, clippy -D warnings, cargo test (real PTYs, the codec
      # against packages/protocol/fixtures).
      - name: fmt + clippy + tests
        run: docker build -f runner/Dockerfile.downloads --target test .

  # WHICH 10x JOBS THIS CHANGE ACTUALLY NEEDS. One ubuntu-latest minute, so
  # that a change which cannot reach a native build does not buy ~155 real
  # macOS minutes (~1,550 included-equivalent, 3.1% of the organisation's
  # month). See the header for why this is a deny list and not an allow list.
  changes:
    # hangar (ARC, cluster B). Nothing in this job is private -- the
    # reason is the organisation's Actions budget, not a lab dependency.
    runs-on: ${{ vars.CI_RUNS_ON || 'hangar' }}
    timeout-minutes: 5
    outputs:
      native: ${{ steps.decide.outputs.native }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: on a pull request HEAD is the merge commit and HEAD^1
          # is the base tip, and on a push `github.event.before` has to be
          # resolvable. A shallow clone has neither.
          fetch-depth: 0
      - id: decide
        env:
          # Empty on workflow_dispatch, which then runs everything.
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -eu

          # FAIL SAFE, IN ONE PLACE. Every path out of this script that is not
          # a confident "nothing native changed" ends here, because spending
          # macOS minutes on a change that did not need them costs money,
          # while skipping them on a change that did costs a broken release.
          run_everything() {
            echo "native=true" >> "$GITHUB_OUTPUT"
            echo "running the native jobs: $1"
            exit 0
          }

          if [ "${GITHUB_EVENT_NAME}" = 'pull_request' ]; then
            # The merge commit's first parent is the base branch tip, so this
            # is exactly what the pull request introduces. An unmergeable pull
            # request has no merge commit and no first parent.
            git rev-parse --verify HEAD^1 >/dev/null 2>&1 \
              || run_everything 'no merge commit to compare against'
            changed=$(git diff --name-only HEAD^1 HEAD)
          else
            case "$BASE" in
              ''|0000000000000000000000000000000000000000)
                run_everything "no comparable predecessor (event ${GITHUB_EVENT_NAME})" ;;
            esac
            git rev-parse --verify "$BASE" >/dev/null 2>&1 \
              || run_everything "the previous commit $BASE is not in this clone"
            changed=$(git diff --name-only "$BASE" HEAD)
          fi

          [ -n "$changed" ] || run_everything 'an empty diff, which should not happen'

          echo 'changed:'
          echo "$changed" | sed 's/^/  /'

          # A `for` loop, not `while read`, because `run_everything` has to
          # be able to `exit` the script and a pipeline would put it in a
          # subshell. The cost is word splitting, which is why a path
          # containing a space falls through to the catch-all and spends the
          # minutes. That is the direction to be wrong in.
          for f in $changed; do
            case "$f" in
              # Prose. Any depth: a README inside the Rust workspace is still
              # a README.
              *.md|docs/*|LICENSE|NOTICE) ;;
              # The publication gate's own program and its allow list. Read by
              # the `scrub` job, by nothing a native build compiles or runs.
              scripts/*) ;;
              # Release plumbing: release.yml and the scripts only it calls.
              # THIS FILE IS NOT HERE ON PURPOSE — see the header.
              .github/workflows/ci.yml) run_everything "$f changed, so the native jobs must prove it" ;;
              .github/*) ;;
              # Everything else, named or not. `runner/**` is the Rust
              # workspace both macOS jobs build; `apps/mac/**` is the app and
              # its end-to-end scripts; `packages/protocol/**` holds fixtures
              # the Rust tests read directly (runner/crates/schema/tests,
              # runner/crates/runner/tests/plugin_*.rs), so a protocol change
              # really can turn the native tests red.
              *) run_everything "$f can affect a native build" ;;
            esac
          done

          echo "native=false" >> "$GITHUB_OUTPUT"
          echo 'skipping the native jobs: nothing outside prose, scripts/ and release plumbing changed'

  runner-macos:
    # BEHIND LINUX ON PURPOSE. The same clippy run and the same workspace
    # tests cost a tenth as much on ubuntu-latest, so if they fail there they
    # are not worth re-discovering on three 10x runners.
    needs: [changes, runner-linux]
    # `needs` still requires runner-linux to SUCCEED (this `if` holds no
    # always()/!cancelled()), so a red tree skips these as before.
    if: needs.changes.outputs.native == 'true'
    # Measured 10-22 minutes. A 10x job with no bound bills to the six-hour
    # default when it hangs, which is 7% of the organisation's month.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Apple Silicon always. Intel only off the pull-request path: it was
        # the most expensive line in this workflow, for the same source on a
        # platform GitHub is retiring (macos-13 is already gone;
        # macos-15-intel is the standard Intel image). `fromJSON` because a
        # matrix list cannot be made conditional element by element.
        runner: ${{ github.event_name == 'pull_request' && fromJSON('["macos-latest"]') || fromJSON('["macos-15-intel","macos-latest"]') }}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: runner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust ${{ env.RUST_VERSION }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy
          rustup default "$RUST_VERSION"
      - name: clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: tests
        run: cargo test --locked --workspace --no-fail-fast
      # The detect crate's macOS code (libproc, sysctl) is only built here: the same
      # 100 % line and branch gate as on Linux.
      - name: detect coverage (nightly, cargo-llvm-cov)
        run: |
          rustup toolchain install nightly-2026-10-01 --profile minimal --component llvm-tools-preview
          cargo install cargo-llvm-cov --version 0.9.1 --locked
          sh scripts/detect-coverage.sh nightly-2026-10-01

  # crates/detect: every line and every branch covered (runner/scripts/detect-coverage.sh).
  detect-coverage:
    # hangar-big, NOT hangar: cargo-llvm-cov instruments and builds the
    # whole Rust workspace twice inside dind, on a nightly toolchain.
    # The shared pool is 6Gi memory and a 4Gi work volume; this one gets
    # 16Gi and 80Gi. Nothing here is private either -- see above.
    runs-on: hangar-big
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: coverage gate
        run: docker build -f runner/Dockerfile.downloads --target coverage .

  protocol:
    # hangar (ARC, cluster B). Nothing in this job is private -- the
    # reason is the organisation's Actions budget, not a lab dependency.
    runs-on: ${{ vars.CI_RUNS_ON || 'hangar' }}
    defaults:
      run:
        working-directory: packages/protocol
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - name: fixtures are up to date
        run: npm run fixtures && git diff --exit-code -- fixtures

  secrets:
    # hangar (ARC, cluster B). Nothing in this job is private -- the
    # reason is the organisation's Actions budget, not a lab dependency.
    runs-on: ${{ vars.CI_RUNS_ON || 'hangar' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks (whole history)
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" zricethezav/gitleaks:v8.30.1 \
            git /repo --redact --exit-code 1
      - name: trufflehog (whole history)
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" trufflesecurity/trufflehog:3.97.9 \
            git file:///repo --exclude-paths /repo/.trufflehog-exclude --no-verification --no-update --fail

  # The publication gate: nothing internal (hosts, accounts, identifiers, private names) in the
  # tree or anywhere in the history (scripts/scrub.py, scripts/scrub-allow.txt).
  scrub:
    # hangar (ARC, cluster B). Nothing in this job is private -- the
    # reason is the organisation's Actions budget, not a lab dependency.
    runs-on: ${{ vars.CI_RUNS_ON || 'hangar' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: scrub gate (tree, then every blob in the history)
        env:
          SCRUB_PRIVATE_PATTERNS: ${{ secrets.SCRUB_PRIVATE_PATTERNS }}
          # The operator's gates are required wherever the secret is available (not on forks' PRs).
          OWN: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          req=""
          if [ "$OWN" = true ]; then req=--require-private; else echo "::notice::fork pull request: generic gates only"; fi
          python3 scripts/scrub.py $req
          python3 scripts/scrub.py --history $req

  # tmuxedo for Mac (apps/mac). Unsigned: signing is the release pipeline's (apps/mac/README.md).
  #   the universal runner from THIS commit (cargo, both architectures, lipo), the app built
  #   unsigned with it embedded, the XCTest suite three times (flakes are fixed, not retried) with
  #   coverage, then the launchd checks (the holder survives runner restarts and app updates) and
  #   separate-user mode: the hidden `tmuxedo` user created by the app's own helper (this runner
  #   has passwordless sudo), the live ACL tests inside XCTest, and Tools/isolation-e2e.sh proving
  #   every boundary three times, each from setup to uninstall.
  mac-app:
    # Behind Linux for the same reason as `runner-macos`: this job builds the
    # universal runner from this commit before it can build the app, so a
    # workspace that does not compile or test on Linux cannot produce an app
    # worth 75 minutes at 10x.
    needs: [changes, runner-linux]
    if: needs.changes.outputs.native == 'true'
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchains
        run: |
          brew install xcodegen
          rustup toolchain install "$RUST_VERSION" --profile minimal --target aarch64-apple-darwin --target x86_64-apple-darwin
          rustup default "$RUST_VERSION"
          xcodebuild -version
          cargo --version
      - name: Build the universal runner from this commit
        working-directory: runner
        run: |
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked --target "$t" -p tmuxedo-runner
          done
          lipo -create target/aarch64-apple-darwin/release/tmuxedo-runner target/x86_64-apple-darwin/release/tmuxedo-runner \
            -output "$RUNNER_TEMP/tmuxedo-runner"
          codesign -f -s - "$RUNNER_TEMP/tmuxedo-runner"
          lipo -archs "$RUNNER_TEMP/tmuxedo-runner"
          "$RUNNER_TEMP/tmuxedo-runner" version --json
          echo "TMUXEDO_RUNNER_BIN=$RUNNER_TEMP/tmuxedo-runner" >> "$GITHUB_ENV"
      - name: Generate the project
        working-directory: apps/mac
        run: xcodegen generate
      - name: Build the app (unsigned, runner embedded)
        working-directory: apps/mac
        run: |
          set -o pipefail
          xcodebuild build -project Tmuxedo.xcodeproj -scheme Tmuxedo -configuration Release -destination 'platform=macOS' \
            -derivedDataPath build/dd CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | tail -40
          APP=build/dd/Build/Products/Release/tmuxedo.app
          test -x "$APP/Contents/Helpers/tmuxedo-runner"
          test -f "$APP/Contents/Library/LaunchAgents/dev.tmuxedo.mac.holder.plist"
          test -f "$APP/Contents/Resources/NOTICE"
          test -x "$APP/Contents/MacOS/tmuxedo-helper"
          plutil -lint "$APP/Contents/Library/LaunchAgents/dev.tmuxedo.mac.holder.plist"
          plutil -lint "$APP/Contents/Library/LaunchDaemons/dev.tmuxedo.mac.helper.plist"
          [ "$(/usr/libexec/PlistBuddy -c 'Print :BundleProgram' "$APP/Contents/Library/LaunchDaemons/dev.tmuxedo.mac.helper.plist")" = "Contents/MacOS/tmuxedo-helper" ]
          if "$APP/Contents/MacOS/tmuxedo-helper" status --owner nobody; then echo "::error::the helper ran without root"; exit 1; fi
          lipo -archs "$APP/Contents/Helpers/tmuxedo-runner"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist"
          echo "APP=$PWD/$APP" >> "$GITHUB_ENV"
      - name: Create the separate user (for the live isolation tests)
        run: |
          sudo -n "$APP/Contents/MacOS/tmuxedo-helper" setup --owner "$(id -un)"
          id tmuxedo
      - name: XCTest, three times, with coverage
        working-directory: apps/mac
        env:
          # xcodebuild passes TEST_RUNNER_<NAME> to the tests as <NAME>.
          TEST_RUNNER_TMUXEDO_TEST_RUNNER: ${{ env.TMUXEDO_RUNNER_BIN }}
          TEST_RUNNER_TMUXEDO_TEST_ISO: "1"
        run: |
          set -o pipefail
          xcodebuild test -project Tmuxedo.xcodeproj -scheme Tmuxedo -destination 'platform=macOS' \
            -derivedDataPath build/dd -enableCodeCoverage YES -resultBundlePath build/tests.xcresult \
            -test-iterations 3 CODE_SIGNING_ALLOWED=NO \
            | grep -E 'error:|failed|passed|skipped|Executed|TEST (SUCCEEDED|FAILED)' | grep -v '^Test Case .* passed' | tail -200
          xcrun xccov view --report --only-targets build/tests.xcresult | tee build/coverage.txt
      - name: launchd end to end (holder survives runner restarts and app updates)
        run: apps/mac/Tools/holder-e2e.sh "$TMUXEDO_RUNNER_BIN"
      - name: Separate user end to end (abuse cases), three times
        run: |
          sudo -n "$APP/Contents/MacOS/tmuxedo-helper" uninstall --owner "$(id -un)"
          for i in 1 2 3; do
            echo "::group::isolation-e2e run $i"
            apps/mac/Tools/isolation-e2e.sh "$APP"
            echo "::endgroup::"
          done
      - name: Summary
        if: always()
        run: |
          {
            echo "### tmuxedo for Mac"
            echo '```'
            cat apps/mac/build/coverage.txt 2>/dev/null || echo "no coverage report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
